<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Invoicify Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-high": "#e7e7f3",
                      "on-error": "#ffffff",
                      "surface-container": "#ededf9",
                      "surface-container-low": "#f3f3fe",
                      "outline": "#737686",
                      "on-secondary-fixed-variant": "#3c475a",
                      "on-secondary-container": "#586377",
                      "surface-container-highest": "#e1e2ed",
                      "on-tertiary": "#ffffff",
                      "tertiary-container": "#bc4800",
                      "on-tertiary-fixed": "#360f00",
                      "background": "#faf8ff",
                      "error": "#ba1a1a",
                      "on-surface-variant": "#434655",
                      "primary-container": "#2563eb",
                      "on-primary-container": "#eeefff",
                      "inverse-on-surface": "#f0f0fb",
                      "surface-container-lowest": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-bright": "#faf8ff",
                      "surface": "#faf8ff",
                      "tertiary-fixed": "#ffdbcd",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#b4c5ff",
                      "primary-fixed-dim": "#b4c5ff",
                      "on-secondary-fixed": "#111c2d",
                      "surface-variant": "#e1e2ed",
                      "primary-fixed": "#dbe1ff",
                      "secondary-container": "#d5e0f8",
                      "primary": "#004ac6",
                      "on-primary-fixed-variant": "#003ea8",
                      "on-primary-fixed": "#00174b",
                      "secondary-fixed-dim": "#bcc7de",
                      "outline-variant": "#c3c6d7",
                      "on-tertiary-container": "#ffede6",
                      "surface-tint": "#0053db",
                      "on-primary": "#ffffff",
                      "surface-dim": "#d9d9e5",
                      "secondary-fixed": "#d8e3fb",
                      "on-secondary": "#ffffff",
                      "on-surface": "#191b23",
                      "inverse-surface": "#2e3039",
                      "tertiary-fixed-dim": "#ffb596",
                      "on-tertiary-fixed-variant": "#7d2d00",
                      "on-background": "#191b23",
                      "secondary": "#545f73",
                      "tertiary": "#943700"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Inter"],
                      "display": ["Inter"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          }
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-6 selection:bg-primary-container selection:text-white">
<!-- Login Container -->
<div class="w-full max-w-md">
<!-- Logo/Header Section -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-2xl shadow-lg mb-4">
<span class="material-symbols-outlined text-white text-3xl" data-icon="receipt_long">receipt_long</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface">Invoicify Pro</h1>
<p class="text-on-surface-variant mt-2 font-medium">Financial Management simplified.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/30 p-8 md:p-10">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant" for="email">Email address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block text-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container focus:ring-primary-container border-outline-variant rounded transition-all" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant" for="remember-me">
                        Stay signed in for 30 days
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white py-3.5 px-4 rounded-lg font-bold text-base shadow-md hover:bg-primary transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>Sign in to Dashboard</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-sm font-medium">
<span class="bg-surface-container-lowest px-4 text-outline">Or continue with</span>
</div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors font-semibold text-sm text-on-surface-variant" type="button">
<img alt="Google Logo" class="w-5 h-5" data-alt="Official Google logo with vibrant primary colors and minimalist round design on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzWyBx3K_wieBHuTO7uDVvcq3hjOtWVwUseR3KdhQIQ0k4Nvgs6Iw3DMCmFkMI541ZF_zJGeZoQNuH1s7UA54qfeTKDZLUfQ3PHLh3sq9fTj6m-MpAwjT6AzXfUCQXlSyq-WqXnJxKzPAK2bE1Yh9kjKAZyDz0cECDWiaXJkKXBM_e6FMTrIXvBUyTpAnIoonVG7Rn8WTF789jdAaodFLio1a17MkWU1HkSms5KJTDHVsF3TyNRXwKw-9LfBRQydIKmcV3TAEuuCw"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors font-semibold text-sm text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px] text-slate-900" data-icon="apple">ios</span>
                    Apple
                </button>
</div>
</div>
<!-- Footer Links -->
<p class="mt-8 text-center text-sm text-on-surface-variant">
            Don't have an account? 
            <a class="font-bold text-primary hover:underline" href="#">Start your 14-day free trial</a>
</p>
<!-- Illustration Background (Visual Flourish) -->
<div class="fixed bottom-0 left-0 -z-10 w-full h-1/3 opacity-40 pointer-events-none">
<div class="absolute bottom-0 left-0 w-full h-full bg-gradient-to-t from-surface-container-highest to-transparent"></div>
</div>
</div>
<!-- Background Decorative Elements -->
<div class="fixed top-[-10%] right-[-5%] w-[400px] h-[400px] bg-primary-container/5 rounded-full blur-3xl -z-20"></div>
<div class="fixed bottom-[-10%] left-[-5%] w-[300px] h-[300px] bg-tertiary-container/5 rounded-full blur-3xl -z-20"></div>
</body></html>
